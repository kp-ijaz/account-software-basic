name: madrasa_accounting
description: "Simple and secure accounting management software for Madrasas."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & BLoC
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0

  # Navigation
  go_router: ^10.0.0

  # Networking
  dio: ^5.0.0
  retrofit: ^4.10.0
  json_annotation: ^4.9.0

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Dependency Injection
  get_it: ^7.6.0

  # PDF Generation
  pdf: ^3.10.0
  printing: ^5.11.0

  # UI
  cupertino_icons: ^1.0.6
  material_design_icons_flutter: ^7.0.7266

  # Date & Time
  intl: ^0.18.1
  table_calendar: ^3.0.9

  # Utils
  logger: ^2.0.2
  flutter_dotenv: ^5.1.0
  connectivity_plus: ^5.0.1
  google_fonts: ^6.1.0
  equatable: ^2.0.5
  dartz: ^0.10.1

  # Code Generation
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  freezed: ^2.4.1
  freezed_annotation: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # Testing
  mockito: ^5.4.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env
    - .env.dev
    - .env.staging

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
